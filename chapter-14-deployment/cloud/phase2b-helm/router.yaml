# Phase 2B: the router is a Helm release with NO pods, only a Service.
# Its selector decides which color gets the traffic.
#   switch:   helm upgrade fraud-router ... --set service.selectorOverride.zero2ai-color=green
#   rollback: helm rollback fraud-router
deployment:
  enabled: false
serviceAccount:
  create: false
service:
  selectorOverride:
    zero2ai-app: fraud-bg
    zero2ai-color: blue
