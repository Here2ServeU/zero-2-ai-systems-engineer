# Phase 3: production settings for BOTH colors.
command: ["gunicorn", "--workers", "2", "--threads", "4", "--bind", "0.0.0.0:5000",
          "--access-logfile", "-", "api:app"]
resources:
  requests: {cpu: 250m, memory: 384Mi}
  limits: {memory: 768Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
pdb:
  enabled: true
topologySpread:
  enabled: true
networkPolicy:
  enabled: true          # deploy.sh adds the VPC range for the load balancer
