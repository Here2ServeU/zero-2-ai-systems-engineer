# Phase 2: two steps, two containers in one pod:
#   init container: python index_corpus.py   (files the notes into /app/vector_db)
#   app container:  python rag_api.py        (answers questions from that index)
# They share the /app/vector_db scratch folder.
initCommand: ["python", "index_corpus.py"]
command: ["python", "rag_api.py"]
scratchMounts: ["/app/vector_db"]
containerPort: 5000
replicaCount: 1
envFromSecrets: ["llm-api-keys"]
resources:
  requests: {cpu: 250m, memory: 1Gi}
  limits: {memory: 2Gi}

# The embedding library may write small lock/cache files next to the model it
# loads, so this app keeps a writable root filesystem. Everything else in the
# hardened defaults (non-root, no privileges, no capabilities) still applies.
securityContext:
  readOnlyRootFilesystem: false
