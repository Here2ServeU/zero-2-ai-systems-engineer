# Phase 2B: monitored API + scraping + the dashboard, all from one Helm release.
# deploy.sh adds: --set-file grafanaDashboard.json=dashboard.json (the file in cloud/)
containerPort: 5000
metricsPort: 8000
replicaCount: 2
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
serviceMonitor:
  enabled: true
  interval: 15s
# Dashboard as code: a ConfigMap labelled grafana_dashboard=1, which Grafana's
# sidecar loads automatically. No clicking around in the UI to rebuild it.
grafanaDashboard:
  enabled: true
