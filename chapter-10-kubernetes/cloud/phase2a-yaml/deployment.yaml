# Phase 2A: the SAME Deployment you ran on your laptop. Only two things change:
#   1. image: comes from your private ECR registry (deploy.sh fills in __IMAGE__)
#   2. resources: the cloud scheduler needs to know how big each copy is
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero2ai-fraud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero2ai-fraud-api
  template:
    metadata:
      labels:
        app: zero2ai-fraud-api
    spec:
      containers:
      - name: fraud-api
        image: __IMAGE__
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
