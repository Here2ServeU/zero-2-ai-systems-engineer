{{- if .Values.externalSecret.enabled }}
{{- $remoteKey := required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey }}
# Where secrets come from: AWS Secrets Manager. No credentials here: the
# External Secrets controller uses its own Pod Identity role (eks stack).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "app.fullname" . }}-aws
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
---
# What to copy: these JSON keys from the remote secret, into a normal
# Kubernetes Secret that the app reads as environment variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "app.fullname" . }}-aws
  target:
    name: {{ include "app.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
