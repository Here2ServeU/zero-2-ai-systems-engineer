# Phase 3: the guard may ACT, but only within tight limits.
cronJob:
  schedule: "*/2 * * * *"

env:
  ALLOW_SCALE: "true"
  MAX_REPLICAS: "5"
  SCALE_STEP: "1"

# It needs a Kubernetes API token to scale...
serviceAccount:
  automount: true

# ...and permission to touch ONLY the metrics-api Deployment and its HPA,
# in this namespace. Nothing else in the cluster.
rbac:
  create: true
  rules:
    - apiGroups: ["apps"]
      resources: ["deployments/scale"]
      resourceNames: ["metrics-api"]
      verbs: ["get", "patch"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      resourceNames: ["metrics-api"]
      verbs: ["get", "patch"]

# Watch the watcher: alert if its runs start failing.
prometheusRule:
  enabled: true
  rules:
    - alert: AIOpsWatcherFailing
      expr: sum(kube_job_status_failed{namespace="zero2ai", job_name=~"aiops-.*"}) > 0
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "The AIOps watcher CronJob has failed runs"
        description: "kubectl -n zero2ai get jobs  (then: kubectl -n zero2ai logs job/<failed-job-name>)"
