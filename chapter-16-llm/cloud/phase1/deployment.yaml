# Phase 1: the chat API on EKS. The API key comes from a Kubernetes Secret
# called llm-api-keys (deploy.sh makes it from YOUR shell's environment
# variables), never from the image or from git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-api-p1
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm-api-p1}
  template:
    metadata:
      labels: {app: llm-api-p1}
    spec:
      containers:
      - name: app
        image: __IMAGE__
        command: ["python", "__SCRIPT__"]
        envFrom:
        - secretRef:
            name: llm-api-keys
        ports:
        - containerPort: 5000
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 256Mi}
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          periodSeconds: 5
