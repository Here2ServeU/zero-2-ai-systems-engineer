# Phase 2B: chat API as a Helm release. deploy.sh sets the command for your
# provider (LLM_PROVIDER=anthropic|openai|gemini, default anthropic).
command: ["python", "llm_api.py"]
containerPort: 5000
replicaCount: 1
# Keys still come from the llm-api-keys Secret made from your environment.
envFromSecrets: ["llm-api-keys"]
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
