{{- if and .Values.tests.enabled .Values.service.enabled }}
# `helm test <release>` runs this pod once: it calls the health endpoint
# through the Service, exactly like `curl .../health` on your laptop.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "app.fullname" . }}-test
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation   # kept until the next test, so `helm test --logs` can show its output
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - >-
          for i in 1 2 3 4 5 6; do
          curl -fsS http://{{ include "app.fullname" . }}:{{ .Values.service.port }}{{ default .Values.probes.path .Values.tests.path }} && exit 0;
          echo "not ready yet, retrying..."; sleep 5;
          done; exit 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
{{- end }}
