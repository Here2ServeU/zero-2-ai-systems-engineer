# Phase 3: MLflow keeps model files in S3 (bucket made by Terraform). The
# "mlflow" service account gets S3 access through EKS Pod Identity: no keys.
# deploy.sh fills in the bucket name with --set.
#
# Still one copy with SQLite: the run list lives on the pod's disk. A real
# team points --backend-store-uri at a managed database (Amazon RDS).
args: ["--host", "0.0.0.0", "--port", "5000", "--workers", "2",
       "--backend-store-uri", "sqlite:////data/mlflow.db",
       "--artifacts-destination", "s3://BUCKET/artifacts",
       "--serve-artifacts"]
env:
  AWS_DEFAULT_REGION: us-east-1
