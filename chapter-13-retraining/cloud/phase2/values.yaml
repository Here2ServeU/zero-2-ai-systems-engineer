# Phase 2: the retraining job on a schedule (Mondays 02:00 UTC, like the
# GitHub Actions workflow in this chapter), logging to the MLflow server.
deployment:
  enabled: false
service:
  enabled: false
tests:
  enabled: false
serviceAccount:
  name: retrain

cronJob:
  enabled: true
  schedule: "0 2 * * 1"
  command: ["sh", "-c", "python drift_detector.py && python retrain_pipeline.py"]
  backoffLimit: 0          # a rejected model should fail loudly, not retry

env:
  MLFLOW_TRACKING_URI: http://mlflow     # the mlflow release's Service
  HOME: /tmp

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1Gi}
