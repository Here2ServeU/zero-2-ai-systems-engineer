# Phase 2B: an MLflow tracking server inside the cluster.
# Runs and model files live on the pod's scratch disk: fine for learning,
# gone if the pod restarts. Phase 3 moves the files to S3.
replicaCount: 1
serviceAccount:
  name: mlflow
command: ["mlflow", "server"]
args: ["--host", "0.0.0.0", "--port", "5000", "--workers", "2",
       "--backend-store-uri", "sqlite:////data/mlflow.db",
       "--artifacts-destination", "/data/artifacts",
       "--serve-artifacts"]
containerPort: 5000
scratchMounts: ["/data"]
probes:
  path: /health
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
